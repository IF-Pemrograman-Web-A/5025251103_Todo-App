<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo List - Style Warrior</title>
  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4c4fb8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <a href="#main" class="skip-link">Lewati ke konten utama</a>
    <header class="site-header">
        <h1>My Todo List</h1>
        <p class="subtitle">Rafifah Nabil Rahmadian</p>
          <button id="darkModeToggle" type="button" aria-label="Toggle dark mode" aria-pressed="false">🌙</button>
    </header>

    <main class="layout" id="main">
        <section class="panel todo-panel">
            <h2>Todo List</h2>
            <ul id="todo-list">
            </ul>
            </section>
            <aside class="panel editor-panel">
                <h2>Todo Detail</h2>

                <form class="todo-form">
                    <label for="todo-title">Title</label>
                    <input type="text" id="todo-title" placeholder="Judul todo...." required>

                    <label for="todo-description">Description</label>
                    <textarea id="todo-description" rows="3" placeholder="Deskripsi todo...."></textarea>

                    <label for="todo-priority">Priority</label>
                    <select id="todo-priority">
                        <option value="low">Low</option>
                        <option value="medium">Medium</option>
                        <option value="high">High</option>
                    </select>
                    <label for="todo-notify">Notification Time</label>
                    <input type="datetime-local" id="todo-notify">
                    <button type="button" id="btn-notif">Aktifkan Notifikasi</button>
                    <p id="notif-status" role="status" aria-live="polite"></p>  
                    <fieldset>
    <legend>Todo Image</legend>

    <video id="camera-preview" autoplay playsinline muted hidden aria-label="Pratinjau kamera"></video>
    <canvas id="photo-canvas" hidden></canvas>
    <img id="photo-preview" alt="Pratinjau foto todo" hidden>

    <button type="button" id="btn-start-camera">Buka Kamera</button>
    <button type="button" id="btn-capture" hidden>Ambil Foto</button>
    <button type="button" id="btn-remove-photo" hidden>Hapus Foto</button>

    <p id="photo-status" role="status" aria-live="polite"></p>
</fieldset>
                    <button type="submit" class="btn-submit">Save Todo</button>
                </form>

                <div class="todo-detail">
                    <h3>Details</h3>
                    <p><strong>Title:</strong> <span id="detail-title">-</span></p>
                    <p><strong>Description:</strong> <span id="detail-description">-</span></p>
                    <p><strong>Priority:</strong> <span id="detail-priority">-</span></p>
                </div>
            </aside>
    </main>
    <footer class="site-footer">
        <p>&copy;initugaspweb</p>
    </footer>
    <script src="db.js"></script>
    <script src="script.js"></script>
</body>


</html>
